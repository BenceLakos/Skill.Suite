name: publish-image

# Builds the Skill Suite platform image (Skill.Suite/Dockerfile), pushes it to the container registry of the
# Gitea instance this repository lives on, and then starts it on the docker host the runner is attached to -
# the same host that runs Gitea, Postgres and Traefik from infra/compose.yaml. A push to main is therefore a
# deployment: the platform that answers at suite.<domain> is the commit that was just pushed.
#
# Why this file lives in .gitea/workflows: Gitea only falls back to .github/workflows when .gitea/workflows
# does not exist. Creating this directory therefore deliberately stops Gitea from picking up judging-ci.yml
# and judging-release.yml - both of which are written for GitHub runners and publish to GHCR and nuget.org,
# neither of which exists here. Those two keep running on GitHub, unchanged.
#
# Session judge images are still never built in CI, here or on GitHub: they bake hidden test suites and, for
# some session types, the reference implementation. They are built out of band and pushed straight to the
# private registry. The generic judge images stay with .github/workflows/judging-release.yml.
#
# Runner prerequisites - the stack in infra/compose.yaml already provides every one of these, so on that
# stack the defaults below work with no configuration beyond the secrets and variables listed further down:
#   * a runner labelled `ubuntu-latest` whose job containers get the HOST docker socket - the stack runs
#     act_runner replicas configured exactly so. Both the build and the deployment go through that socket,
#     which is what makes "start it where Gitea runs" true;
#   * name resolution for the registry host from inside the job container. Gitea sits behind Traefik with
#     ROOT_URL http://git.${DOMAIN}/, so github.server_url - and the registry host derived from it - is
#     `git.<domain>`. Traefik holds `git.<domain>` and `suite.<domain>` as network aliases on the
#     `skill-suite` network, and the runners put job containers on that network, so the name resolves
#     without any LAN DNS;
#   * the registry is plain http. Neither the build nor the deployment leans on the host daemon's
#     `insecure-registries` for that - see the credential and buildx steps, and DEPLOY_REGISTRY below;
#   * actions/checkout, docker/* resolve from github.com unless the runner sets a different
#     default_actions_url, so the runner needs outbound network on first run.
#
# Secrets (repository or owner level). scripts/gitea-push.sh stores all of them from this checkout's .env:
#   REGISTRY_USERNAME / REGISTRY_TOKEN        REQUIRED. A personal access token with the `package` permission
#                                             set to Read and Write (scope write:package), and its user. The
#                                             automatic per-job token cannot be used: Gitea 1.26 accepts it
#                                             for Basic auth but the registry's token exchange demands a
#                                             package scope the job token does not carry, and answers with a
#                                             bare 401 "failed to fetch oauth token".
#   SKILLSUITE_ADMIN_PASSWORD                 REQUIRED for the deployment; the password of the administrator
#                                             compose.production.yaml seeds on first boot.
#
# Variables (repository or owner level), all optional unless marked:
#   SKILLSUITE_ADMIN_USER        REQUIRED for the deployment; the administrator's user name (not a credential,
#                                so a variable, which is also where scripts/gitea-push.sh files it).
#   DOMAIN, SKILLSUITE_GIT_INTERNAL_URL, SKILLSUITE_WEBHOOK_URL, SKILLSUITE_JUDGE_MEMORY, SKILLSUITE_JUDGE_CPUS,
#   SKILLSUITE_JUDGE_PIDS, SKILLSUITE_CONCURRENT_RUNS, SKILLSUITE_BIND
#                                the same knobs .env.example documents, with the same defaults when unset.
#   AUTO_DEPLOY                  set to `false` to build and push without starting anything.
#   DEPLOY_REGISTRY              where the HOST daemon pulls the image from; defaults to `localhost:3000`, the
#                                port infra/compose.yaml publishes Gitea on. localhost is implicitly insecure
#                                for docker, so no daemon.json change is needed. Set it to `git.<domain>` on
#                                a host that has that in insecure-registries and resolves it.
#   SKILLSUITE_COMPOSE_FILES     compose files for the deployment, default "compose.yaml compose.production.yaml".
#   REGISTRY_HOST                registry host:port the BUILD pushes to. Defaults to the host of the instance
#                                ROOT_URL, correct whenever the runner reaches Gitea under the browser's name.
#   IMAGE_PLATFORMS              build platform, defaults to linux/amd64. The deployment pins the platform it
#                                runs to the first entry, so an arm64 test machine sets `linux/arm64` here once.
#   BUILDX_NETWORK               docker network the buildx builder container joins, defaults to `skill-suite`
#                                so the builder resolves the `git.<domain>` alias. `host` on a bare-metal runner.

on:
  push:
    branches: [main]
    # Platform releases only. The judging layer tags `judging-v*`, which does not match `v*`, so a judging
    # release never triggers a platform image build.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag to apply (optional)'
        type: string
        default: ''
      deploy:
        description: 'Start the built image on the docker host'
        type: boolean
        default: true

# Gitea ignores these, but they keep the file honest if it is ever run on GitHub.
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: skill-suite

jobs:
  image:
    name: build and publish the platform image
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      deploy_tag: ${{ steps.meta.outputs.deploy_tag }}
    steps:
      - uses: actions/checkout@v4

      # Runs first because both the builder and the credential file below need the registry host.
      #
      # Everything the following steps need is computed here, in POSIX shell only (no bashisms: the runner
      # image decides whether `run:` is bash or sh). Values arrive as env, not inline expressions.
      - name: Derive image reference and tags
        id: meta
        env:
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          SERVER_URL: ${{ github.server_url }}
          OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu

          # The registry is served by the Gitea instance itself, so its host is the ROOT_URL's host:port.
          host="${REGISTRY_HOST:-}"
          if [ -z "${host}" ]; then
            url="${SERVER_URL:-}"
            url="${url%/}"        # ROOT_URL is configured with a trailing slash
            host="${url#*://}"    # drop the scheme
            host="${host%%/*}"    # drop any sub-path, keep host:port
          fi
          if [ -z "${host}" ]; then
            echo "::error::cannot determine the registry host - set the REGISTRY_HOST variable" && exit 1
          fi

          # Registries reject uppercase path components, and Gitea owner names are free to contain them.
          owner="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="${host}/${owner}/${IMAGE_NAME}"
          sha7="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"

          # `primary` is the immutable tag the deployment runs; the others are conveniences.
          case "${EVENT_NAME}" in
            workflow_dispatch)
              # Never :latest from a manual run - that tag is what a deployment pulls.
              primary="dev-${sha7}"
              names="${primary}"
              if [ -n "${INPUT_TAG:-}" ]; then names="${names} ${INPUT_TAG}"; fi
              ;;
            *)
              case "${REF}" in
                refs/tags/v*)
                  primary="${REF#refs/tags/v}"
                  names="${primary} latest"
                  ;;
                refs/heads/main)
                  # sha- alongside :latest so a deployment can be pinned to the exact commit it was cut from.
                  primary="sha-${sha7}"
                  names="latest ${primary}"
                  ;;
                *)
                  primary="dev-${sha7}"
                  names="${primary}"
                  ;;
              esac
              ;;
          esac

          {
            echo "registry=${host}"
            echo "owner=${owner}"
            echo "image=${image}"
            echo "deploy_tag=${primary}"
            echo "tags<<EOF"
            for name in ${names}; do echo "${image}:${name}"; done
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          echo "will publish:"
          for name in ${names}; do echo "  ${image}:${name}"; done

      # Only when the operator asks for something other than the runner's own architecture: emulating a
      # foreign arch inside a runner is slow, and production is amd64 (compose.yaml pins linux/amd64).
      - name: Set up QEMU
        if: vars.IMAGE_PLATFORMS != '' && vars.IMAGE_PLATFORMS != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      # Also gives a docker-container builder, which is what makes the registry cache below exportable - and
      # that builder is a container of its own, with its own registry configuration and its own network view:
      #   * the host daemon's `insecure-registries` does not reach it, so the plain-http registry has to be
      #     declared to BuildKit directly (http = true is what makes it speak http at all; insecure = true
      #     covers the case where the operator later fronts it with a self-signed certificate);
      #   * it has to sit on the stack network to resolve the `git.<domain>` alias Traefik answers to. Set
      #     vars.BUILDX_NETWORK to `host` on a bare-metal runner that reaches the registry via LAN DNS.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=${{ vars.BUILDX_NETWORK || 'skill-suite' }}
          buildkitd-config-inline: |
            [registry."${{ steps.meta.outputs.registry }}"]
              http = true
              insecure = true

      # Deliberately not the docker login action: that shells out to `docker login`, which the docker CLI
      # hands to the HOST daemon (POST /auth). The host daemon would then have to resolve `git.<domain>`
      # itself and carry the registry in its own `insecure-registries` - CI coupled to host DNS and host
      # daemon configuration. Writing the credential file by hand keeps the exchange inside the job
      # container: buildx reads ~/.docker/config.json when it pushes, so the host daemon never sees this.
      #
      # A personal access token, never the automatic job token: Gitea's registry token exchange
      # (container.Authenticate) rejects any authenticated credential without a package scope, and the job
      # token has none. Failing here with the reason beats buildx's "failed to fetch oauth token: unauthorized"
      # twenty minutes later. The username must be the user the token belongs to.
      - name: Write registry credentials
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu

          if [ -z "${REGISTRY_USERNAME:-}" ] || [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "::error::secrets REGISTRY_USERNAME and REGISTRY_TOKEN are not set. Create a personal access token" \
                 "(Settings -> Applications, permission package: Read and Write) for the user that owns the" \
                 "${REGISTRY} namespace and add both as Actions secrets on this repository or its owner."
            exit 1
          fi

          # -w0 is GNU; busybox and BSD base64 need the wrapping stripped afterwards instead.
          auth="$(printf '%s:%s' "${REGISTRY_USERNAME}" "${REGISTRY_TOKEN}" | base64 -w0 2>/dev/null \
                  || printf '%s:%s' "${REGISTRY_USERNAME}" "${REGISTRY_TOKEN}" | base64 | tr -d '\n')"

          umask 077
          mkdir -p "${HOME}/.docker"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "${REGISTRY}" "${auth}" > "${HOME}/.docker/config.json"
          chmod 600 "${HOME}/.docker/config.json"

          echo "credentials for ${REGISTRY} written as ${REGISTRY_USERNAME}"

      # Context is the repo root, not Skill.Suite/: the Dockerfile does `COPY . .` and restores all four
      # csproj folders. .dockerignore keeps judging/ out, bar the shared Protocol sources.
      #
      # The cache is a registry layer cache in the same namespace as the image. Gitea's registry accepts OCI
      # cache manifests, which is what image-manifest=true,oci-mediatypes=true asks for. A cache miss on the
      # first run is normal and not an error.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Skill.Suite/Dockerfile
          platforms: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          echo "Pushed:"
          printf '%s\n' "${TAGS}"

  # The job container carries the host docker socket, so `docker compose up` here creates the platform
  # container on the HOST daemon, next to Gitea on the `skill-suite` network - exactly what
  # `docker compose -f compose.yaml -f compose.production.yaml up -d` does when typed on that host. Only the
  # compose FILES are read from the job's checkout: the production stack mounts docker volumes exclusively,
  # never a host directory, because a path named here would be resolved by a daemon that cannot see the
  # checkout - and, under Docker Desktop, cannot mount anything outside its shared folders at all.
  deploy:
    name: start the platform on this docker host
    needs: image
    if: vars.AUTO_DEPLOY != 'false' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
    runs-on: ubuntu-latest
    env:
      DEPLOY_REGISTRY: ${{ vars.DEPLOY_REGISTRY || 'localhost:3000' }}
      COMPOSE_FILES: ${{ vars.SKILLSUITE_COMPOSE_FILES || 'compose.yaml compose.production.yaml' }}
    steps:
      - uses: actions/checkout@v4

      # The pull is performed by the host daemon, but the credentials for it come from the client config in
      # this job container - compose forwards them with the pull request - so the same file as in the build
      # job, keyed by the host the daemon will contact.
      - name: Write registry credentials for the pull
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          auth="$(printf '%s:%s' "${REGISTRY_USERNAME}" "${REGISTRY_TOKEN}" | base64 -w0 2>/dev/null \
                  || printf '%s:%s' "${REGISTRY_USERNAME}" "${REGISTRY_TOKEN}" | base64 | tr -d '\n')"
          umask 077
          mkdir -p "${HOME}/.docker"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "${DEPLOY_REGISTRY}" "${auth}" > "${HOME}/.docker/config.json"
          chmod 600 "${HOME}/.docker/config.json"

      # Compose interpolates from the process environment, so the deployment settings are passed as env and
      # no .env file is written: a password containing `$` or quotes would need escaping in a .env file and
      # needs none here. An unset variable arrives as an empty string, which compose's `${X:-default}` treats
      # as unset, so every knob keeps the default .env.example documents.
      - name: Pull and start
        env:
          SKILLSUITE_IMAGE: ${{ env.DEPLOY_REGISTRY }}/${{ needs.image.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ needs.image.outputs.deploy_tag }}
          IMAGE_PLATFORMS: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
          SKILLSUITE_ADMIN_USER: ${{ vars.SKILLSUITE_ADMIN_USER }}
          SKILLSUITE_ADMIN_PASSWORD: ${{ secrets.SKILLSUITE_ADMIN_PASSWORD }}
          DOMAIN: ${{ vars.DOMAIN }}
          SKILLSUITE_GIT_INTERNAL_URL: ${{ vars.SKILLSUITE_GIT_INTERNAL_URL }}
          SKILLSUITE_WEBHOOK_URL: ${{ vars.SKILLSUITE_WEBHOOK_URL }}
          SKILLSUITE_JUDGE_MEMORY: ${{ vars.SKILLSUITE_JUDGE_MEMORY }}
          SKILLSUITE_JUDGE_CPUS: ${{ vars.SKILLSUITE_JUDGE_CPUS }}
          SKILLSUITE_JUDGE_PIDS: ${{ vars.SKILLSUITE_JUDGE_PIDS }}
          SKILLSUITE_CONCURRENT_RUNS: ${{ vars.SKILLSUITE_CONCURRENT_RUNS }}
          SKILLSUITE_BIND: ${{ vars.SKILLSUITE_BIND }}
        run: |
          set -eu

          if [ -z "${SKILLSUITE_ADMIN_USER:-}" ] || [ -z "${SKILLSUITE_ADMIN_PASSWORD:-}" ]; then
            echo "::error::variable SKILLSUITE_ADMIN_USER and secret SKILLSUITE_ADMIN_PASSWORD are not set; the" \
                 "production stack seeds its administrator from them. scripts/gitea-push.sh stores them from .env."
            exit 1
          fi

          # The image was built for the first (usually only) platform in IMAGE_PLATFORMS; run it as that.
          SKILLSUITE_PLATFORM="${IMAGE_PLATFORMS%%,*}"
          export SKILLSUITE_PLATFORM

          set -- ; for file in ${COMPOSE_FILES}; do set -- "$@" -f "${file}"; done

          echo "deploying ${SKILLSUITE_IMAGE} (${SKILLSUITE_PLATFORM}) with: ${COMPOSE_FILES}"
          docker compose "$@" pull skill.suite
          # --no-build: compose.yaml carries a build: section for local development, and without this a
          # missing image would be built from the checkout instead of pulled - a different binary from the
          # one that was tested. --wait blocks on the production healthcheck, so green here means it answers.
          docker compose "$@" up -d --no-build --wait --wait-timeout 300 skill.suite
          docker compose "$@" ps skill.suite

          echo
          echo "running ${SKILLSUITE_IMAGE}"
          if [ -n "${DOMAIN:-}" ]; then echo "  http://suite.${DOMAIN}/"; fi
          echo "  http://<docker host>:8080/"
