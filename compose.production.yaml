# Production overlay. Use INSTEAD of compose.override.yaml, which is local-development only:
#
#   docker compose -f compose.yaml -f compose.production.yaml up -d
#
# compose.override.yaml is applied automatically by plain `docker compose up`, and it deliberately weakens
# things for local work — it turns on unsigned webhook pushes and drops the platform pin. Naming this file
# explicitly is what keeps those out of a competition deployment.
#
# Requires a .env beside it; see .env.example. Nothing secret is in this file, so it is safe to commit.

services:
  skill.suite:
    # Survive a crash, an OOM kill and a host reboot. Without this an app restart is a manual step nobody is
    # watching for mid-competition, and every queued submission is lost with the process.
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # Seeded on first boot only, from the environment. appsettings.Development.json ships a known
      # admin/Admin1234! pair; in Production nothing is seeded unless these are set, so the credential that can
      # rewrite marks never exists in git.
      Seed__Admin__Username: "${SKILLSUITE_ADMIN_USER:?set SKILLSUITE_ADMIN_USER in .env}"
      Seed__Admin__Password: "${SKILLSUITE_ADMIN_PASSWORD:?set SKILLSUITE_ADMIN_PASSWORD in .env}"
      Seed__Admin__FullName: "Competition Administrator"

      # The git host as THIS PROCESS reaches it, over the container network — not as a browser reaches it.
      # StartSession refuses to provision without it, so a Production stack that omits this cannot start a
      # session at all.
      Webhook__GitInternalBaseUrl: "${SKILLSUITE_GIT_INTERNAL_URL:-http://gitea:3000}"

      # The git host's view of this application, written into every competitor webhook at session start.
      # Wrong here is silent: repositories get provisioned, hooks get installed, and no push ever arrives.
      Webhook__PublicWebhookUrl: "${SKILLSUITE_WEBHOOK_URL:-http://skill-suite:8080/webhooks/git}"

      # The SQL Server as THIS PROCESS reaches it, over the container network. The competitors page creates a
      # login and a database per competitor here, as the Microsoft SQL Server credential stored in the
      # platform. Wrong here is not silent - provisioning reports the connection failure on the row.
      MsSql__Server: "${SKILLSUITE_MSSQL_SERVER:-mssql,1433}"

      # Domain the synthetic <username>@<domain> address of each Gitea user is built from. Gitea requires a
      # unique address per user and nothing is ever sent to it, so this must stay a domain no real mail server
      # will accept delivery for.
      CompetitorAccounts__GiteaEmailDomain: "${SKILLSUITE_COMPETITOR_EMAIL_DOMAIN:-competitors.local}"

      # Judge container caps. Uncapped by default in the application, which lets one competitor allocating in a
      # loop take the host down along with every run on it. Size these for the competition machine; a black-box
      # session needs headroom because Stryker re-runs the whole suite once per mutant.
      Webhook__JudgeMemoryLimit: "${SKILLSUITE_JUDGE_MEMORY:-4g}"
      Webhook__JudgeCpuLimit: "${SKILLSUITE_JUDGE_CPUS:-2}"
      Webhook__JudgePidsLimit: "${SKILLSUITE_JUDGE_PIDS:-512}"
      Webhook__MaxConcurrentRuns: "${SKILLSUITE_CONCURRENT_RUNS:-2}"

      # Explicit, not inherited. compose.override.yaml turns this on for the scripted harness, which inserts
      # sessions with SQL and therefore pushes unsigned. In production an unsigned push is an anonymous
      # judging trigger for anyone who can reach the port.
      Webhook__AllowUnsignedPushes: "false"

    volumes:
      # Starter packages the session authors produced, in a docker-managed volume rather than a host directory.
      # Session.TemplateFolder is read by THIS process, so the packages have to be where the process can see
      # them, and a volume is the one place that is the same on a Linux, macOS or Windows docker host - a bind
      # mount named from the deploy job would be a path the daemon in Docker Desktop's VM cannot share. Filled
      # from the Starter packages page in the UI, or from a shell with scripts/starter-packages.sh; included in
      # scripts/backup.sh snapshots. Read-write: the UI writes uploads into it.
      - starter-packages:/starter-packages

    # Container logs are unbounded by default, and a judgement run is chatty. Filling the disk mid-competition
    # takes Postgres down with it.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    healthcheck:
      # /healthz is the anonymous liveness endpoint Program.cs maps; curl is installed into the image for this
      # probe, because the aspnet runtime image carries neither curl nor wget and a missing tool reports as
      # "unhealthy" indistinguishably from a dead application. The deploy job's `up --wait` blocks on this.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    ports:
      # 8080 only. 8081 is the HTTPS port the container does not terminate, and exposing it on a venue network
      # advertises a service that cannot answer.
      - "${SKILLSUITE_BIND:-0.0.0.0}:8080:8080"

volumes:
  starter-packages:
    name: skill-suite-starter-packages
