services:
  skill.suite:
    container_name: skill-suite
    image: ghcr.io/blz-it/skill.suite:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Skill.Suite/Dockerfile
    # Survive a crash, an OOM kill and a host reboot. Without it an app restart is a manual step nobody is
    # watching for mid-competition — and every submission the in-process queue was holding is lost with the
    # process. The worker's startup pass re-enqueues them, but only if something restarts the process.
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=skillsuite;Username=skillsuite;Password=skillsuite"
      ASPNETCORE_ENVIRONMENT: Development
      # Webhook: cloned submissions live on a docker-managed volume so the deployment
      # doesn't depend on a host path. The judgement container the app spawns receives
      # only its own submission via --mount volume-subpath, keeping submissions isolated.
      Webhook__WorkingDirectory: /workdir
      Webhook__WorkdirVolumeName: skill-suite-workdir
      Webhook__ContainerWorkdir: /workspace
      Webhook__FolderTemplate: "submission-{competitor}-{random}"
      # Gitea exposes itself externally as http://localhost:3000 in the webhook
      # payload, but the app talks to it over the docker network. This base URL
      # replaces the scheme/host/port of every clone URL before git clone runs.
      Webhook__GitInternalBaseUrl: "http://gitea:3000"
      # Persist ASP.NET data-protection keys so cookies + encrypted secrets survive
      # container restarts. Without this the key ring is regenerated on every boot
      # and the app fails with "The key {…} was not found in the key ring".
      DataProtection__KeyRingPath: /var/skill-suite/keys
    volumes:
      # /var/run/docker.sock lets the app spawn judgement containers via the host daemon.
      # `workdir` is a docker-managed volume — the same volume is mounted by the daemon
      # into each judgement container at /workspace.
      - /var/run/docker.sock:/var/run/docker.sock
      - workdir:/workdir
      - keys:/var/skill-suite/keys
    ports:
      - "8080:8080"
      - "8081:8081"
    # Traefik runs in infra/compose.yaml and discovers this container over the shared `skill-suite` network,
    # so the route lives here as labels rather than in a proxy configuration file. The 8080 host port stays
    # published as a direct fallback for when the proxy or name resolution is the thing being debugged.
    labels:
      - traefik.enable=true
      - traefik.http.routers.suite.rule=Host(`suite.${DOMAIN:-localhost}`)
      - traefik.http.routers.suite.entrypoints=web
      # The container exposes 8080 and 8081; 8081 is https the container does not terminate, so name the one.
      - traefik.http.services.suite.loadbalancer.server.port=8080
    networks:
      - skill-suite

# Network and database services live in infra/compose.yaml. Bring infra up first
# (`docker compose -f infra/compose.yaml up -d`), then this stack.
volumes:
  workdir:
    name: skill-suite-workdir
  keys:
    name: skill-suite-keys

networks:
  skill-suite:
    name: skill-suite
    external: true
